name: Documentation Agent (Copilot)

on:
  pull_request:
    types: [opened, synchronize]
# Testing one more time
jobs:
  assign_to_copilot:
    runs-on: ubuntu-latest

    steps:
      - name: Create issue for docs updates and assign to Copilot coding agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          title="Docs pass for PR #${PR_NUMBER}"
          body=$'Please review the referenced PR and improve documentation only:\n\n- Add or improve code comments/docstrings (no logic changes)\n- Update README.md and related docs if needed\n- Keep content scannable; use relative links for repo files; descriptive links + alt text for images\n\nPR:\n'"${PR_URL}"

          payload="$(jq -n \
            --arg title "$title" \
            --arg body "$body" \
            --arg repo "$REPO" \
            --arg agent "documentation-engineer" \
            '{
              title: $title,
              body: $body,
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repo,
                base_branch: "main",
                custom_instructions: "Documentation-only changes. Do not modify business logic.",
                custom_agent: $agent
              }
            }')"

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/issues" \
            -d "${payload}"
